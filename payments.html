<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments</title>
  <link rel="icon" type="image/png" href="/images/user/NULOGO.png">
  <link rel="stylesheet" href="/css/payments.css">
</head>
<body>

  <!-- User Profile (Top Right Inside Container) -->
  <div class="profile-container">
    <img id="userProfilePic" src="/images/user/default.jpg" alt="User Profile">
  </div>

  <div class="main-container">
    <div class="header">
      <a href="/menu.html" title="Go to Home">&#8962;</a>
      <h1>Payments</h1>
    </div>

    <!-- Active Payments -->
    <div class="parent-container" id="paymentList">
      <!-- Filled by main.js -->
    </div>

    <!-- View Payment History Button -->
    <div class="history-container">
      <button class="view-history-btn" onclick="togglePaymentHistory()">View Payment History</button>
    </div>

    <!-- Payment History Section -->
    <div id="archivedPaymentsContainer" class="hidden"></div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
